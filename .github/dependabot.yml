version: 2
updates:
  # pnpm / npm — grouped minors/patches weekly, majors separate to avoid surprise breaking changes
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # keep pnpm locked version aligned with packageManager — do not bump pnpm itself in grouped PR
    ignore:
      - dependency-name: pnpm
        update-types: [version-update:semver-major]

  # GitHub Actions — grouped, weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [ci, dependencies]
    groups:
      actions:
        patterns: ["*"]
