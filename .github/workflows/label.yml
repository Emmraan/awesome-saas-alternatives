name: label

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: auto-label by paths
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Ensure labels exist
        uses: actions/github-script@v9
        with:
          script: |
            const labels = [
              { name: 'data', color: '0E8A16', description: 'data/products.json' },
              { name: 'ui', color: '1D76DB', description: 'app/components ui' },
              { name: 'ci', color: 'FEF2C0', description: 'ci workflows' },
              { name: 'deps', color: '0366D6', description: 'dependencies' },
              { name: 'docs', color: '0075CA', description: 'docs' },
              { name: 'dependencies', color: '0366D6', description: 'dependabot' },
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: l.name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: l.name, color: l.color, description: l.description });
                } else throw e;
              }
            }

      - name: Label by paths
        uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
