name: links

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "data/**"
      - "app/**"
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "data/**"
      - "app/**"
  schedule:
    - cron: "0 7 * * 1" # weekly Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: lychee (README + data URLs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # README hero Cloudinary excluded (private) — data website/repo checked
          args: >-
            --verbose
            --no-progress
            --exclude-mail
            --max-retries 2
            --exclude "https://res.cloudinary.com/*"
            README.md CONTRIBUTING.md data/products.json
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
